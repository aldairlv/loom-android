syntax = "proto3";

import "com/loom/data/dark_theme_config.proto";
import "com/loom/data/theme_brand.proto";

option java_package = "com.loom.core.datastore";
option java_multiple_files = true;

message UserPreferences {
  ThemeBrandProto theme_brand = 1;
  DarkThemeConfigProto dark_theme_config = 2;
  bool use_dynamic_color = 3;
  bool should_hide_onboarding = 4;
  string access_token = 5;
  string refresh_token = 6;
  string user_id = 7;
}
